name: App-Icons erzeugen
on:
  push:
    branches: [main]
    paths: ["icon.svg", ".github/workflows/icons.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rsvg installieren
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: PNGs aus icon.svg erzeugen
        run: |
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
          rsvg-convert -w 180 -h 180 icon.svg -o icon-180.png
      - name: Icons committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-180.png
          git diff --cached --quiet || (git commit -m "App-Icons aus icon.svg erzeugt" && git push)
